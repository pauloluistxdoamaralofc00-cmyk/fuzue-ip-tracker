<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Jogos - Cadastro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-custom-dark { background-color: #0f172a; }
        .bg-card { background-color: #1e293b; }
        .btn-green { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .btn-green:hover { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); }
    </style>
</head>
<body class="bg-custom-dark text-white min-h-screen flex flex-col justify-between font-sans">

    <!-- Header / Topo -->
    <header class="w-full py-4 px-6 bg-card border-b border-slate-800 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="bg-green-500 text-slate-950 font-black text-xl px-3 py-1 rounded-lg tracking-wider">BET<span class="text-white">VIP</span></div>
        </div>
        <div>
            <a href="#login" class="text-sm font-semibold text-slate-300 hover:text-white mr-4">Entrar</a>
            <a href="#register" class="text-sm font-semibold bg-slate-800 border border-slate-700 px-4 py-2 rounded-lg text-white">Registro</a>
        </div>
    </header>

    <!-- Conteúdo Principal / Formulário de Cadastro -->
    <main class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-md bg-card border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
            
            <!-- Detalhe decorativo de luz -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-green-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold tracking-tight">Crie sua Conta</h1>
                <p class="text-xs text-slate-400 mt-1">Cadastre-se agora e ganhe bônus exclusivo no primeiro depósito!</p>
            </div>

            <!-- Formulário -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">
                
                <!-- Moeda -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Moeda</label>
                    <select class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-500 text-white">
                        <option value="BRL" selected>BRL (R$)</option>
                    </select>
                </div>

                <!-- Telefone ou E-mail -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Telefone ou E-mail</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" required placeholder="Seu e-mail ou celular" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-green-500 text-white">
                    </div>
                </div>

                <!-- Senha -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Senha</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" required placeholder="Mínimo de 6 caracteres" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-green-500 text-white">
                    </div>
                </div>

                <!-- Código de Indicação (Opcional/Automático) -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Código de Indicação (Opcional)</label>
                    <input type="text" id="refCode" value="27933741" readonly class="w-full bg-slate-950 border border-slate-800 text-slate-500 rounded-xl px-4 py-3 text-sm cursor-not-allowed">
                </div>

                <!-- Termos -->
                <div class="flex items-start space-x-2 pt-1">
                    <input type="checkbox" required id="terms" class="mt-1 rounded bg-slate-900 border-slate-700 text-green-500 focus:ring-0">
                    <label for="terms" class="text-xs text-slate-400">Confirmo que tenho pelo menos 18 anos de idade e concordo com os Termos e Condições.</label>
                </div>

                <!-- Botão de Envio -->
                <button type="submit" class="w-full btn-green text-slate-950 font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-green-900/20 mt-2">
                    CRIAR CONTA
                </button>
            </form>

            <!-- Rodapé do Card -->
            <div class="mt-6 text-center border-t border-slate-800/60 pt-4">
                <p class="text-xs text-slate-400">Já tem uma conta? <a href="#" class="text-green-400 font-semibold hover:underline">Entrar</a></p>
            </div>

        </div>
    </main>

    <!-- Rodapé -->
    <footer class="py-4 text-center text-xs text-slate-600 border-t border-slate-900">
        &copy; 2026 Todos os direitos reservados. Jogue com responsabilidade. +18
    </footer>

    <script>
        function handleRegister(event) {
            event.preventDefault();
            alert('Cadastro simulado com sucesso! Redirecionando para a plataforma...');
            // Aqui você pode colocar o redirecionamento real ou integração com backend
        }
    </script>
</body>
</html>
