<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Warning</title>
<style>
:root{--bg:#000000;--card:#050505;--border:#121212;--red:#ff0033;--red-glow:rgba(255,0,51,0.25);--text:#e6e6e6;--muted:#555555}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New', Courier, monospace;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.container{width:100%;max-width:380px;text-align:center}

.screen{background:var(--card);border:1px solid var(--border);padding:28px 20px;border-radius:8px;box-shadow:0 0 50px rgba(0,0,0,0.9)}

/* Logotipo Obscuro / Alerta */
.skull-logo{font-size:2.2rem;margin-bottom:12px;filter:drop-shadow(0 0 8px var(--red));animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:0.6} 50%{opacity:1} 100%{opacity:0.6}}

.alert-title{font-size:0.85rem;font-weight:900;color:var(--red);margin-bottom:8px;letter-spacing:2px;text-transform:uppercase}
.alert-desc{font-size:0.7rem;color:var(--muted);margin-bottom:20px;line-height:1.5}

/* Dados em Tempo Real */
.data-box{background:#000000;border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:20px;text-align:left;font-size:0.7rem}
.data-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.02)}
.data-row:last-child{border-bottom:none}
.data-label{color:var(--muted)}
.data-val{color:var(--red);font-weight:700}

.btn-admin{background:transparent;color:var(--muted);border:1px solid var(--border);padding:10px;width:100%;border-radius:6px;cursor:pointer;font-weight:700;text-transform:uppercase;font-size:0.65rem;letter-spacing:1px;transition:all 0.2s}
.btn-admin:hover{color:#fff;border-color:#333}

/* Painel Admin */
.admin-title{font-size:0.85rem;font-weight:900;color:#fff;margin-bottom:14px;letter-spacing:1.5px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.stat-box{background:#000000;border:1px solid var(--border);padding:10px;border-radius:6px;text-align:center}
.stat-box span{display:block;font-size:1.1rem;font-weight:800;color:var(--red);margin-top:4px}
.admin-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:0.62rem;text-align:left}
.admin-table th, .admin-table td{padding:6px 4px;border-bottom:1px solid var(--border);white-space:nowrap}
.admin-table th{color:var(--red)}

.btn-back{background:#111;color:#fff;border:1px solid var(--border);padding:10px;width:100%;border-radius:6px;cursor:pointer;font-weight:700;text-transform:uppercase;font-size:0.65rem;margin-top:15px}
</style>
</head>
<body>

<div class="container">

  <!-- Ecrã Principal (Obscuro) -->
  <div id="home-screen" class="screen">
    <div class="skull-logo">⚠️</div>
    <div class="alert-title">Você acabou de vazar seu IP.</div>
    <div class="alert-desc">A sua pegada digital foi totalmente registada e exposta neste terminal.</div>

    <div class="data-box">
      <div class="data-row"><span class="data-label">IP:</span><span id="targetIp" class="data-val">A rastrear...</span></div>
      <div class="data-row"><span class="data-label">Local:</span><span id="targetLocation" class="data-val">A localizar...</span></div>
      <div class="data-row"><span class="data-label">Provedor:</span><span id="targetIsp" class="data-val">A identificar...</span></div>
      <div class="data-row"><span class="data-label">Dispositivo:</span><span id="targetDevice" class="data-val">A detetar...</span></div>
    </div>

    <button class="btn-admin" onclick="openAdmin()">Acessar administração</button>
  </div>

  <!-- Painel Administrativo -->
  <div id="admin-screen" class="screen" style="display:none;">
    <div class="admin-title">TERMINAL SECRETO</div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <small style="color:var(--muted); font-size:0.6rem;">Acessos Totais</small>
        <span id="totalHits">0</span>
      </div>
      <div class="stat-box">
        <small style="color:var(--muted); font-size:0.6rem;">Estado</small>
        <span style="color:#00ff66">ONLINE</span>
      </div>
    </div>

    <p style="font-size:0.65rem; color:var(--muted); margin-bottom:6px; text-align:left;">Alvos Capturados:</p>
    <div style="max-height:160px; overflow-y:auto;">
      <table class="admin-table">
        <thead>
          <tr><th>Hora</th><th>IP</th><th>Device</th></tr>
        </thead>
        <tbody id="adminLogs">
          <tr><td colspan="3" style="text-align:center; color:var(--muted);">Nenhum alvo registado.</td></tr>
        </tbody>
      </table>
    </div>

    <button class="btn-back" onclick="closeAdmin()">Voltar</button>
  </div>

</div>

<script>
let totalHits = 0;
let captureLogs = [];

// Função para detetar o modelo/marca do telemóvel ou PC de forma limpa
function getDeviceInfo() {
  let ua = navigator.userAgent;
  let device = "Desconhecido";

  if (/iphone/i.test(ua)) device = "Apple iPhone";
  else if (/ipad/i.test(ua)) device = "Apple iPad";
  else if (/samsung/i.test(ua) || /sm-/i.test(ua)) device = "Samsung Galaxy";
  else if (/xiaomi|redmi|poco/i.test(ua)) device = "Xiaomi/Redmi";
  else if (/huawei|honor/i.test(ua)) device = "Huawei";
  else if (/moto/i.test(ua)) device = "Motorola";
  else if (/android/i.test(ua)) device = "Android Device";
  else if (/windows/i.test(ua)) device = "PC Windows";
  else if (/macintosh|mac os x/i.test(ua)) device = "Apple Mac";
  else if (/linux/i.test(ua)) device = "Linux PC";

  return device;
}

// Executa imediatamente assim que a página abre (Puxa o IP em tempo real)
window.onload = async function() {
  let deviceBrand = getDeviceInfo();
  document.getElementById('targetDevice').innerText = deviceBrand;

  try {
    let res = await fetch('https://ipwho.is/');
    let data = await res.json();

    if(data.success) {
      document.getElementById('targetIp').innerText = data.ip;
      document.getElementById('targetLocation').innerText = `${data.city || 'N/A'}, ${data.country_code || ''}`;
      document.getElementById('targetIsp').innerText = data.connection?.isp || 'N/A';

      // Regista automaticamente no painel oculto do admin
      totalHits++;
      let timeNow = new Date().toLocaleTimeString();
      captureLogs.push({
        time: timeNow,
        ip: data.ip,
        device: deviceBrand
      });
    } else {
      document.getElementById('targetIp').innerText = "Indisponível";
      document.getElementById('targetLocation').innerText = "Protegido";
    }
  } catch(e) {
    document.getElementById('targetIp').innerText = "Erro de rede";
  }
};

function openAdmin() {
  let pass = prompt('Palavra-passe de acesso:');
  if(pass === '17102007') {
    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    updateAdminStats();
  } else if(pass !== null) {
    alert('Acesso negado.');
  }
}

function closeAdmin() {
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('home-screen').style.display = 'block';
}

function updateAdminStats() {
  document.getElementById('totalHits').innerText = totalHits;

  let tbody = document.getElementById('adminLogs');
  if(captureLogs.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--muted);">Nenhum alvo registado.</td></tr>`;
    return;
  }

  tbody.innerHTML = captureLogs.map(log => `
    <tr>
      <td>${log.time}</td>
      <td><code>${log.ip}</code></td>
      <td>${log.device}</td>
    </tr>
  `).join('');
}
</script>
</body>
</html>
