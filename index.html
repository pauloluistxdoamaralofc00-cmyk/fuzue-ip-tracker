<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fuzue developer - Painel</title>
<style>
:root{--bg:#0a0a0c;--card:#121216;--border:#22222d;--red:#ff3333;--text:#e0e0e6;--muted:#888899;--green:#00ff66}
*{margin:0;padding:0;box-sizing:border-box;font-family:monospace}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{width:100%;max-width:900px}
#login{background:var(--card);border:1px solid var(--border);padding:40px;border-radius:8px;text-align:center}
h1{color:var(--red);font-size:1.5rem;margin-bottom:10px;text-transform:lowercase}
p{color:var(--muted);margin-bottom:20px}
input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px;margin-bottom:15px;text-align:center;font-size:1rem}
button{background:var(--red);color:#fff;border:none;padding:12px 20px;width:100%;border-radius:4px;cursor:pointer;font-weight:bold;text-transform:uppercase}
button:hover{opacity:.9}
#panel{display:none}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.status{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.dot{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green)}
.alert{background:rgba(255,51,51,.1);border-left:4px solid var(--red);padding:15px;margin-bottom:20px;font-size:.85rem;color:var(--red);text-align:left}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border);font-size:.85rem}
th{color:var(--muted);text-transform:uppercase}
td{color:var(--text)}
</style>
</head>
<body>
<div class="container">
<div id="login">
<h1>fuzue developer</h1>
<p>Insira a senha de acesso</p>
<input type="password" id="pass" placeholder="••••••••">
<button onclick="check()">Entrar</button>
</div>
<div id="panel">
<div class="header">
<h1>fuzue developer</h1>
<div class="status"><div class="dot"></div>Ativo</div>
</div>
<div class="alert">⚠️ ATENÇÃO: Acessos monitorados para prevenção de fraudes.</div>
<table>
<thead>
<tr><th>Horário</th><th>IP</th><th>Local</th><th>ISP</th></tr>
</thead>
<tbody id="tb"></tbody>
</table>
</div>
</div>
<script>
function check(){
  if(document.getElementById('pass').value==='17102007'){
    document.getElementById('login').style.display='none';
    document.getElementById('panel').style.display='block';
    load();
  }else{
    alert('Senha incorreta!');
  }
}
async function load(){
  try{
    let r=await fetch('https://ipapi.co/json/');
    let d=await r.json();
    let loc=d.status==='success'?`${d.city} - ${d.country}`:'Desconhecido';
    let isp=d.status==='success'?d.isp:'Desconhecido';
    let logs=JSON.parse(localStorage.getItem('logs')||'[]');
    logs.unshift({time:new Date().toLocaleString('pt-BR'),ip:d.ip,loc,isp});
    localStorage.setItem('logs',JSON.stringify(logs));
    tb.innerHTML=logs.map(l=>`<tr><td>${l.time}</td><td style="color:#ff9999">${l.ip}</td><td>${l.loc}</td><td>${l.isp}</td></tr>`).join('');
  }catch(e){
    tb.innerHTML=`<tr><td colspan="4">Erro ao carregar dados.</td></tr>`;
  }
}
</script>
</body>
</html>
