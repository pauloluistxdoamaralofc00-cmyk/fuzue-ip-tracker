<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Discord Server Cloner - Mobile VIP</title>
<style>
:root{--bg:#313338;--card:#2b2d31;--border:#1e1f22;--discord-blurple:#5865f2;--discord-glow:rgba(88,101,242,0.3);--text:#dbdee1;--muted:#949ba4;--green:#23a55a;--red:#f23f43}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px}
.container{width:100%;max-width:440px}

/* Topbar */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:0 4px}
.brand{font-weight:800;font-size:1.05rem;color:#fff;display:flex;align-items:center;gap:6px}
.brand span{color:var(--discord-blurple)}
.admin-link{font-size:0.75rem;color:var(--muted);cursor:pointer;font-weight:600}
.admin-link:hover{color:#fff}

/* Ecrãs */
.screen{background:var(--card);border:1px solid var(--border);padding:20px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
.screen h2{font-size:1.05rem;font-weight:800;text-align:center;margin-bottom:4px;color:#fff}
.screen p{font-size:0.72rem;color:var(--muted);text-align:center;margin-bottom:14px;line-height:1.4}

.form-group{margin-bottom:12px;text-align:left}
.form-group label{font-size:0.68rem;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px;font-weight:700}
input{width:100%;padding:11px 14px;background:#1e1f22;border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:0.85rem;font-weight:600}
input:focus{outline:none;border-color:var(--discord-blurple);box-shadow:0 0 8px var(--discord-glow)}

/* Checkboxes de Opções */
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.option-card{background:#1e1f22;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:0.75rem;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text)}
.option-card input{width:auto;cursor:pointer}

.btn-discord{background:var(--discord-blurple);color:#fff;border:none;padding:13px;width:100%;border-radius:8px;cursor:pointer;font-weight:800;text-transform:uppercase;font-size:0.82rem;letter-spacing:0.5px;box-shadow:0 4px 15px var(--discord-glow);transition:opacity 0.2s}
.btn-discord:hover{opacity:0.9}

/* Barra de Progresso */
.progress-box{display:none;margin-top:14px;background:#1e1f22;border:1px solid var(--border);border-radius:8px;padding:12px;text-align:left}
.progress-bar-bg{width:100%;background:#2b2d31;height:8px;border-radius:4px;margin-top:8px;overflow:hidden}
.progress-bar-fill{width:0%;background:var(--green);height:100%;transition:width 0.4s ease}

/* Painel Admin */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.stat-box{background:#1e1f22;border:1px solid var(--border);padding:12px;border-radius:8px;text-align:center}
.stat-box span{display:block;font-size:1.3rem;font-weight:800;color:var(--discord-blurple);margin-top:4px}
.admin-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:0.7rem;text-align:left}
.admin-table th, .admin-table td{padding:8px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
.admin-table th{color:var(--discord-blurple)}
</style>
</head>
<body>

<div class="container">

  <!-- Topbar -->
  <div class="topbar">
    <div class="brand">🧬 CLONER <span>VIP</span></div>
    <div class="admin-link" onclick="openAdmin()">Admin</div>
  </div>

  <!-- Ecrã Principal -->
  <div id="home-screen" class="screen">
    <h2>Clonagem de Servidor Discord</h2>
    <p>Simulador mobile para cópia de estrutura entre servidores.</p>

    <div class="form-group">
      <label>Link de Convite ou ID (Origem):</label>
      <input type="text" id="sourceInput" placeholder="Ex: discord.gg/origem">
    </div>

    <div class="form-group">
      <label>ID do Teu Servidor (Destino):</label>
      <input type="text" id="destInput" placeholder="Ex: 109283748592">
    </div>

    <p style="text-align:left; font-size:0.68rem; color:var(--muted); margin-bottom:6px; font-weight:700;">Itens para Clonar:</p>
    <div class="options-grid">
      <label class="option-card"><input type="checkbox" checked> Cargos</label>
      <label class="option-card"><input type="checkbox" checked> Canais & Calls</label>
      <label class="option-card"><input type="checkbox" checked> Permissões</label>
      <label class="option-card"><input type="checkbox"> Emojis</label>
    </div>

    <button class="btn-discord" onclick="iniciarClonagem()">Iniciar Clonagem</button>

    <!-- Progresso -->
    <div id="progressBox" class="progress-box">
      <div style="display:flex;justify-content:space-between;font-size:0.75rem;font-weight:700;">
        <span id="progressText">A estabelecer ligação...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Painel Administrativo -->
  <div id="admin-screen" class="screen" style="display:none;">
    <h3 style="color:var(--discord-blurple); margin-bottom:12px; text-align:center;">Painel VIP - Gestão</h3>
    
    <div class="stats-grid">
      <div class="stat-box">
        <small style="color:var(--muted); font-size:0.68rem;">Total Clonagens</small>
        <span id="totalClones">0</span>
      </div>
      <div class="stat-box">
        <small style="color:var(--muted); font-size:0.68rem;">Membros Online</small>
        <span id="onlineMembers" style="color:var(--green)">1</span>
      </div>
    </div>

    <p style="font-size:0.72rem; color:var(--muted); margin-bottom:6px;">Registo de Acessos:</p>
    <div style="max-height:200px; overflow-y:auto;">
      <table class="admin-table">
        <thead>
          <tr><th>Horário</th><th>IP</th><th>Cidade</th></tr>
        </thead>
        <tbody id="adminLogs">
          <tr><td colspan="3" style="text-align:center; color:var(--muted);">A carregar dados...</td></tr>
        </tbody>
      </table>
    </div>

    <button class="btn-discord" style="background:#3f4147; color:#fff; margin-top:15px; box-shadow:none;" onclick="closeAdmin()">Fechar Painel</button>
  </div>

</div>

<script>
let totalClones = 0;
let accessLogs = [];
let visitorIp = 'A detetar...';
let visitorCity = 'A detetar...';

window.onload = async function() {
  try {
    let res = await fetch('https://ipwho.is/');
    let data = await res.json();
    if(data.success) {
      visitorIp = data.ip;
      visitorCity = `${data.city || 'N/A'}, ${data.region_code || ''}`;
    }
  } catch(e) {
    visitorIp = '127.0.0.1';
    visitorCity = 'Rede Local';
  }
};

function iniciarClonagem() {
  let source = document.getElementById('sourceInput').value.trim();
  let dest = document.getElementById('destInput').value.trim();

  if(!source || !dest) {
    alert('❌ Preencha ambos os campos de servidor.');
    return;
  }

  document.getElementById('progressBox').style.display = 'block';
  let bar = document.getElementById('progressBar');
  let text = document.getElementById('progressText');
  let percent = document.getElementById('progressPercent');

  let p = 0;
  let interval = setInterval(() => {
    p += 25;
    bar.style.width = p + '%';
    percent.innerText = p + '%';

    if(p === 25) text.innerText = 'A extrair estrutura de cargos...';
    if(p === 75) text.innerText = 'A criar canais e calls no destino...';
    if(p === 100) {
      clearInterval(interval);
      text.innerText = 'Concluído com sucesso!';
      totalClones++;
      registarAcessoAdmin();
      setTimeout(() => {
        alert('🎉 Estrutura clonada com sucesso!');
        document.getElementById('progressBox').style.display = 'none';
        bar.style.width = '0%';
        document.getElementById('sourceInput').value = '';
        document.getElementById('destInput').value = '';
      }, 500);
    }
  }, 400);
}

function registarAcessoAdmin() {
  let timeNow = new Date().toLocaleTimeString();
  if(!accessLogs.some(log => log.ip === visitorIp)) {
    accessLogs.push({ time: timeNow, ip: visitorIp, city: visitorCity });
  }
}

function openAdmin() {
  let pass = prompt('Digite a senha de administração:');
  if(pass === '17102007') {
    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    updateAdminStats();
  } else if(pass !== null) {
    alert('Senha incorreta!');
  }
}

function closeAdmin() {
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('home-screen').style.display = 'block';
}

function updateAdminStats() {
  document.getElementById('totalClones').innerText = totalClones;
  document.getElementById('onlineMembers').innerText = Math.floor(1 + Math.random() * 2);

  let tbody = document.getElementById('adminLogs');
  if(accessLogs.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--muted);">Nenhum registo ainda.</td></tr>`;
    return;
  }

  tbody.innerHTML = accessLogs.map(log => `
    <tr>
      <td>${log.time}</td>
      <td><code>${log.ip}</code></td>
      <td>📍 ${log.city}</td>
    </tr>
  `).join('');
}
</script>
</body>
</html>
