<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>fuzue developer - Painel</title><style>:root{--bg:#0a0a0c;--card:#121216;--border:#22222d;--red:#ff3333;--text:#e0e0e6;--muted:#888899;--green:#00ff66}*{margin:0;padding:0;box-sizing:border-box;font-family:monospace}body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.container{width:100%;max-width:900px}#login{background:var(--card);border:1px solid var(--border);padding:40px;border-radius:8px;text-align:center}h1{color:var(--red);font-size:1.5rem;margin-bottom:10px;text-transform:lowercase}p{color:var(--muted);font-size:0.9rem;margin-bottom:20px}.box{display:flex;flex-direction:column;gap:15px;max-width:300px;margin:0 auto}input{background:#050507;border:1px solid var(--border);padding:12px;color:var(--text);text-align:center;border-radius:4px;outline:none}button{background:var(--red);color:#fff;border:none;padding:12px;font-weight:bold;cursor:pointer;border-radius:4px}#panel{display:none;background:var(--card);border:1px solid var(--border);padding:30px;border-radius:8px}.header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:15px;margin-bottom:20px}.badge{display:flex;align-items:center;gap:8px;color:var(--green);font-size:0.85rem}.dot{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green)}.warn{background:rgba(255,51,51,0.05);border-left:3px solid var(--red);padding:12px;margin-bottom:20px;font-size:0.85rem;color:#ff9999}table{width:100%;border-collapse:collapse;text-align:left;font-size:0.85rem}th,td{padding:10px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:normal}</style></head><body><div class="container"><div id="login"><h1>fuzue developer</h1><p>Área restrita de monitoramento</p><div class="box"><input type="password" id="pass" placeholder="Senha"><button onclick="login()">Acessar</button><span id="err" style="color:var(--red);font-size:0.8rem;display:none">Senha incorreta</span></div></div><div id="panel"><div class="header"><h1>fuzue developer</h1><div class="badge"><div class="dot"></div>Ativo</div></div><div class="warn"><strong>⚠️ ATENÇÃO:</strong> Acessos monitorados para prevenção de fraudes.</div><table><thead><tr><th>Horário</th><th>IP</th><th>Local</th><th>ISP</th></tr></thead><tbody id="tb"></tbody></table></div></div><script>function login(){if(document.getElementById('pass').value==='17102007'){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';loadData();}else{document.getElementById('err').style.display='block';}}async function loadData(){const tb=document.getElementById('tb');try{const res=await fetch('https://api.ipify.org?format=json');const d=await res.json();const geo=await fetch(`http://ip-api.com/json/${d.ip}`).then(r=>r.json());let loc=geo.status==='success'?`${geo.city} - ${geo.country}`:'Desconhecido';let isp=geo.status==='success'?geo.isp:'Desconhecido';let logs=JSON.parse(localStorage.getItem('logs')||'[]');logs.unshift({time:new Date().toLocaleString('pt-BR'),ip:d.ip,loc,isp});localStorage.setItem('logs',JSON.stringify(logs));tb.innerHTML=logs.map(l=>`<tr><td>${l.time}</td><td style="color:#ff9999">${l.ip}</td><td>${l.loc}</td><td>${l.isp}</td></tr>`).join('');}catch(e){tb.innerHTML=`<tr><td colspan="4">Erro ao carregar dados.</td></tr>`;}}</script></body></html>
